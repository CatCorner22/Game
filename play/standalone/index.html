<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>THRESHOLD — Playable Command Preview v2.3 — Standalone</title>
  <style>
:root {
      color-scheme: dark;
      --bg: #020617;
      --surface: rgba(8, 18, 37, 0.88);
      --surface2: rgba(12, 29, 55, 0.82);
      --panel: rgba(8, 20, 40, 0.72);
      --fg: #e9f7ff;
      --muted: #93abc1;
      --subtle: #59728a;
      --line: rgba(57, 210, 255, 0.18);
      --accent: #39d2ff;
      --accent2: #8b5cf6;
      --danger: #ff4d7d;
      --warn: #fbbf24;
      --good: #45e6a7;
      --shadow: 0 24px 80px rgba(0,0,0,.42);
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --safe-top: max(10px, env(safe-area-inset-top));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); overflow-x: hidden; }
    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--fg);
      background:
        radial-gradient(ellipse 75% 55% at 50% -10%, rgba(57,210,255,.13), transparent 60%),
        radial-gradient(ellipse 45% 35% at 100% 40%, rgba(139,92,246,.09), transparent 60%),
        linear-gradient(180deg,#020617,#071329 50%,#020617);
      line-height: 1.45;
    }
    body.large-text { font-size: 118%; }
    body.high-contrast {
      --surface: rgba(0,0,0,.97);
      --surface2: rgba(3,15,27,.98);
      --panel: rgba(0,0,0,.94);
      --fg: #fff;
      --muted: #d0e7f5;
      --subtle: #a2bdcf;
      --line: rgba(57,210,255,.55);
    }
    button, select, input { font: inherit; }
    button { touch-action: manipulation; }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .screen { min-height: 100dvh; }
    .hidden { display: none !important; }
    .shell {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: var(--safe-top) 18px calc(88px + var(--safe-bottom));
    }
    .grid-bg {
      position: fixed; inset: 0; pointer-events: none; opacity: .42;
      background-image: linear-gradient(rgba(57,210,255,.035) 1px, transparent 1px), linear-gradient(90deg,rgba(57,210,255,.035) 1px,transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse 85% 80% at 50% 35%,#000 20%,transparent 80%);
    }
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; opacity: .3;
      background: repeating-linear-gradient(to bottom,rgba(57,210,255,.018) 0,rgba(57,210,255,.018) 1px,transparent 1px,transparent 4px);
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.016)), var(--panel);
      box-shadow: 0 6px 28px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      margin: 0; color: var(--accent); font: 700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1,h2,h3 { margin: 0; letter-spacing: .035em; }
    h1 { font-size: clamp(3rem, 13vw, 7.5rem); line-height: .9; text-shadow: 0 0 36px rgba(57,210,255,.34); }
    h2 { font-size: clamp(1.4rem, 4vw, 2.2rem); }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .landing-head {
      display: flex; gap: 24px; justify-content: space-between; align-items: flex-end;
      padding: 28px 0; border-bottom: 1px solid var(--line);
    }
    .landing-copy { max-width: 760px; }
    .tagline { margin: 14px 0 0; color: var(--accent); font-weight: 750; letter-spacing: .22em; text-transform: uppercase; }
    .intro { max-width: 700px; margin: 20px 0 0; color: var(--muted); font-size: 1.05rem; }
    .content-note { max-width: 470px; padding: 17px; }
    .content-note p:last-child { margin: 9px 0 0; color: var(--muted); font-size: .9rem; }
    .setup-grid { display: grid; gap: 18px; margin-top: 22px; grid-template-columns: minmax(0,1.35fr) minmax(300px,.65fr); }
    .setup-main, .setup-side { padding: 20px; }
    .setup-side { position: sticky; top: 14px; align-self: start; }
    .section-title { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .section-title span { color: var(--subtle); font-size: .84rem; }
    .scenario-grid { display:grid; gap:10px; grid-template-columns: repeat(2,minmax(0,1fr)); }
    .scenario-card {
      width: 100%; min-height: 122px; padding: 14px; text-align:left; color:var(--fg);
      border:1px solid var(--line); border-radius:13px; background:rgba(7,19,38,.72);
      transition: transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    }
    .scenario-card:hover { transform: translateY(-2px); border-color: rgba(57,210,255,.5); }
    .scenario-card.selected { border-color: var(--accent); box-shadow:0 0 0 1px rgba(57,210,255,.22),0 0 28px rgba(57,210,255,.14); }
    .scenario-card .meta { display:flex; justify-content:space-between; gap:8px; color:var(--accent); font:700 10px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.1em; }
    .scenario-card h3 { margin-top:8px; font-size:1rem; }
    .scenario-card p { margin:7px 0 0; color:var(--muted); font-size:.83rem; }
    .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .pill { border:1px solid var(--line); border-radius:999px; padding:4px 7px; color:var(--subtle); font-size:.68rem; }
    .choice-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:8px; }
    .choice {
      min-height: 88px; padding:12px; text-align:left; color:var(--fg); border:1px solid var(--line); border-radius:12px; background:var(--surface2);
    }
    .choice.selected { border-color:var(--accent); background:rgba(57,210,255,.12); box-shadow:0 0 24px rgba(57,210,255,.11); }
    .choice strong { display:block; }
    .choice small { display:block; margin-top:5px; color:var(--muted); line-height:1.35; }
    .setup-block + .setup-block { margin-top:18px; }
    .select-row { display:grid; gap:7px; }
    select {
      width:100%; min-height:48px; padding:0 12px; color:var(--fg); border:1px solid var(--line); border-radius:10px; background:#0a1930;
    }
    .launch {
      width:100%; min-height:58px; margin-top:20px; border:1px solid rgba(255,77,125,.7); border-radius:12px;
      background:linear-gradient(135deg,rgba(255,77,125,.82),rgba(168,35,96,.92)); color:#fff; font-weight:850; letter-spacing:.14em; text-transform:uppercase;
      box-shadow:0 0 35px rgba(255,77,125,.2);
    }
    .resume { width:100%; min-height:48px; margin-top:10px; border:1px solid var(--line); border-radius:11px; background:var(--surface2); color:var(--accent); font-weight:750; }
    .summary-list { margin:15px 0 0; padding:0; list-style:none; display:grid; gap:8px; font-size:.88rem; }
    .summary-list li { display:flex; justify-content:space-between; gap:14px; color:var(--muted); }
    .summary-list b { color:var(--fg); text-align:right; }
    .topbar {
      position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:12px;
      min-height:64px; margin:0 -18px; padding:var(--safe-top) 18px 8px; border-bottom:1px solid var(--line); background:rgba(2,6,23,.9); backdrop-filter:blur(18px);
    }
    .brand { min-width:0; }
    .brand strong { display:block; letter-spacing:.18em; }
    .brand span { display:block; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font:600 10px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; }
    .top-actions { display:flex; align-items:center; gap:7px; }
    .chip { display:inline-flex; align-items:center; min-height:30px; padding:0 9px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--muted); font:700 10px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; }
    .chip.danger { color:var(--danger); border-color:rgba(255,77,125,.5); }
    .icon-btn { min-width:44px; min-height:44px; border:1px solid var(--line); border-radius:11px; background:var(--surface2); color:var(--fg); }
    .game-grid { display:grid; grid-template-columns:270px minmax(0,1fr) 330px; gap:14px; padding-top:14px; min-height:calc(100dvh - 82px); }
    .column { min-width:0; }
    .panel-pad { padding:16px; }
    .meter + .meter { margin-top:13px; }
    .meter-head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .meter-head span:first-child { color:var(--muted); font-size:.78rem; }
    .meter-head b { font:750 12px ui-monospace,monospace; color:var(--fg); }
    .bar { height:7px; margin-top:5px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.055); }
    .bar > i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .35s ease; }
    .bar.bad > i { background:linear-gradient(90deg,var(--warn),var(--danger)); }
    .mission { margin-top:14px; padding:13px; }
    .mission p { margin:7px 0 0; color:var(--muted); font-size:.82rem; }
    .event-card { padding:20px; min-height:335px; position:relative; overflow:hidden; }
    .event-card::after { content:""; position:absolute; width:240px; height:240px; right:-90px; top:-100px; border-radius:50%; background:rgba(57,210,255,.09); filter:blur(45px); pointer-events:none; }
    .event-kicker { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .event-title { margin-top:14px; font-size:clamp(1.7rem,5vw,3.2rem); line-height:1.05; }
    .event-body { margin:18px 0 0; color:var(--muted); font-size:1rem; max-width:760px; }
    .event-question { margin:18px 0 0; padding:14px; border-left:3px solid var(--accent); background:rgba(57,210,255,.055); color:var(--fg); }
    .dependency-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin-top:18px; }
    .dependency { padding:11px; border:1px solid var(--line); border-radius:11px; background:rgba(7,19,38,.6); }
    .dependency strong { display:block; color:var(--accent); font-size:.76rem; }
    .dependency span { display:block; margin-top:4px; color:var(--subtle); font-size:.72rem; }
    .action-panel { padding:16px; }
    .action-list { display:grid; gap:9px; margin-top:13px; }
    .action {
      width:100%; min-height:80px; padding:12px; text-align:left; color:var(--fg); border:1px solid var(--line); border-radius:12px; background:var(--surface2);
    }
    .action:hover { border-color:rgba(57,210,255,.45); }
    .action.selected { border-color:var(--accent); background:rgba(57,210,255,.1); }
    .action .row { display:flex; justify-content:space-between; gap:9px; }
    .action b { color:var(--fg); }
    .cost { color:var(--warn); font:700 10px ui-monospace,monospace; }
    .action p { margin:5px 0 0; color:var(--muted); font-size:.78rem; }
    .execute { width:100%; min-height:52px; margin-top:12px; border:1px solid var(--accent); border-radius:11px; background:var(--accent); color:#03111e; font-weight:900; text-transform:uppercase; letter-spacing:.1em; }
    .execute:disabled { opacity:.38; }
    .ai-card, .continuity-card, .log-card { margin-top:14px; padding:15px; }
    .recommend { margin-top:11px; padding:12px; border:1px solid var(--line); border-radius:11px; background:rgba(2,6,23,.6); }
    .recommend strong { color:var(--accent); text-transform:uppercase; }
    .recommend p { margin:6px 0 0; color:var(--muted); font-size:.79rem; }
    .votes { margin-top:10px; display:grid; gap:7px; }
    .vote { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:.76rem; color:var(--muted); }
    .vote b { color:var(--fg); }
    .status-line { display:flex; justify-content:space-between; gap:12px; margin-top:10px; color:var(--muted); font-size:.78rem; }
    .status-line b { color:var(--fg); }
    .log { max-height:270px; overflow-y:auto; margin:11px 0 0; padding:0; list-style:none; display:grid; gap:8px; }
    .log li { padding:9px 10px; border-left:2px solid var(--line); background:rgba(255,255,255,.018); color:var(--muted); font-size:.75rem; }
    .log li strong { color:var(--fg); }
    .mobile-nav { display:none; }
    .tab-only { display:block; }
    .dialog {
      position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center; padding:16px 16px var(--safe-bottom); background:rgba(0,0,0,.78); backdrop-filter:blur(8px);
    }
    .dialog-box { width:min(620px,100%); max-height:88dvh; overflow:auto; padding:20px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:50px; border-bottom:1px solid var(--line); }
    .settings-row input { width:22px; height:22px; }
    .end { min-height:100dvh; display:grid; place-items:center; padding:var(--safe-top) 18px var(--safe-bottom); }
    .end-card { width:min(760px,100%); padding:26px; }
    .grade { font-size:5rem; color:var(--accent); line-height:1; text-shadow:0 0 30px rgba(57,210,255,.3); }
    .end-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:20px; }
    .end-stat { padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--surface2); }
    .end-stat small { display:block; color:var(--subtle); text-transform:uppercase; letter-spacing:.08em; }
    .end-stat b { display:block; margin-top:4px; }
    .end-actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }
    .end-actions button { min-height:48px; flex:1; min-width:180px; border:1px solid var(--line); border-radius:11px; background:var(--surface2); color:var(--fg); font-weight:750; }
    .end-actions .primary { background:var(--accent); color:#03111e; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* Turn feedback and guided action flow */
    .turn-progress {
      display:grid; grid-template-columns:auto minmax(90px,1fr) auto; align-items:center; gap:10px;
      margin:0 -18px; padding:8px 18px; border-bottom:1px solid var(--line); background:rgba(2,6,23,.68);
      color:var(--muted); font:700 10px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase;
    }
    .turn-progress .track { height:6px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.06); }
    .turn-progress .track i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .35s ease; }
    .workflow { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-bottom:12px; }
    .workflow-step { min-height:54px; padding:9px; border:1px solid var(--line); border-radius:10px; background:rgba(2,6,23,.42); color:var(--subtle); }
    .workflow-step b { display:block; color:inherit; font:800 10px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; }
    .workflow-step span { display:block; margin-top:3px; font-size:.68rem; line-height:1.25; }
    .workflow-step.active { color:var(--accent); border-color:rgba(57,210,255,.48); background:rgba(57,210,255,.08); }
    .workflow-step.done { color:var(--good); border-color:rgba(69,230,167,.32); }
    .action-guide { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:11px; background:rgba(2,6,23,.56); }
    .action-guide strong { display:block; color:var(--fg); }
    .action-guide span { display:block; margin-top:4px; color:var(--muted); font-size:.76rem; }
    .action-guide.ready { border-color:rgba(57,210,255,.48); background:rgba(57,210,255,.07); }
    .execute-dock { margin-top:12px; }
    .execute { position:relative; overflow:hidden; transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease; }
    .execute:not(:disabled) { box-shadow:0 0 0 1px rgba(57,210,255,.22),0 0 28px rgba(57,210,255,.22); }
    .execute:not(:disabled):active { transform:scale(.985); }
    .execute.busy::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent); animation:resolve-scan .85s linear infinite; }
    .execute-help { margin:8px 0 0; color:var(--subtle); text-align:center; font-size:.7rem; }
    .next-step { min-height:48px; margin-top:18px; padding:0 16px; border:1px solid var(--accent); border-radius:11px; background:rgba(57,210,255,.11); color:var(--accent); font-weight:800; }
    .outcome-banner { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; padding:14px; border-color:rgba(69,230,167,.32); background:linear-gradient(145deg,rgba(69,230,167,.09),rgba(255,255,255,.015)),var(--panel); }
    .outcome-banner strong { display:block; margin-top:4px; color:var(--good); }
    .outcome-banner span { display:block; margin-top:3px; color:var(--muted); font-size:.78rem; }
    .outcome-banner button { min-height:42px; flex:0 0 auto; padding:0 12px; border:1px solid rgba(69,230,167,.4); border-radius:10px; background:rgba(69,230,167,.08); color:var(--good); font-weight:800; }
    .result-dialog { align-items:center; padding:var(--safe-top) 14px var(--safe-bottom); }
    .result-card { width:min(680px,100%); max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 18px); overflow:hidden; display:flex; flex-direction:column; padding:0; border-color:rgba(69,230,167,.42); box-shadow:0 28px 100px rgba(0,0,0,.62),0 0 46px rgba(69,230,167,.12); animation:result-in .24s ease-out; }
    .result-scroll { min-height:0; overflow:auto; padding:22px 22px 12px; overscroll-behavior:contain; }
    .result-footer { flex:0 0 auto; padding:12px 22px 18px; border-top:1px solid var(--line); background:linear-gradient(180deg,rgba(8,20,40,.9),rgba(8,20,40,.99)); box-shadow:0 -14px 30px rgba(0,0,0,.2); }
    .result-footer p { margin:0 0 9px; color:var(--subtle); text-align:center; font-size:.7rem; }
    .result-head { display:flex; align-items:center; gap:14px; }
    .result-mark { display:grid; place-items:center; width:54px; height:54px; flex:0 0 auto; border:1px solid rgba(69,230,167,.52); border-radius:50%; background:rgba(69,230,167,.1); color:var(--good); font-size:1.6rem; font-weight:900; box-shadow:0 0 28px rgba(69,230,167,.16); }
    .result-head h2 { margin-top:4px; }
    .result-action { margin:4px 0 0; color:var(--good); font-weight:800; }
    .result-narrative { margin:18px 0 0; padding:14px; border-left:3px solid var(--good); background:rgba(69,230,167,.055); color:var(--fg); }
    .delta-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:16px; }
    .delta-item { padding:11px; border:1px solid var(--line); border-radius:11px; background:rgba(2,6,23,.55); }
    .delta-item small { display:block; color:var(--subtle); text-transform:uppercase; letter-spacing:.06em; }
    .delta-item b { display:block; margin-top:4px; color:var(--fg); }
    .delta-item em { display:block; margin-top:3px; font:800 11px ui-monospace,monospace; font-style:normal; }
    .delta-item.good em { color:var(--good); }
    .delta-item.bad em { color:var(--danger); }
    .delta-item.neutral em { color:var(--muted); }
    .next-preview { margin-top:16px; padding:14px; border:1px solid var(--line); border-radius:11px; background:var(--surface2); }
    .next-preview strong,.next-preview span { display:block; }
    .next-preview strong { margin-top:6px; color:var(--accent); }
    .next-preview span { margin-top:5px; color:var(--muted); font-size:.78rem; }
    .continue-button { width:100%; min-height:54px; margin-top:0; border:1px solid var(--accent); border-radius:11px; background:var(--accent); color:#03111e; font-weight:900; text-transform:uppercase; letter-spacing:.09em; box-shadow:0 0 30px rgba(57,210,255,.2); }
    .result-secondary { width:100%; min-height:44px; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface2); color:var(--muted); font-weight:750; }
    @keyframes resolve-scan { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
    @keyframes result-in { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:none; } }

    @media (max-width: 980px) {
      .landing-head { align-items:flex-start; flex-direction:column; }
      .content-note { max-width:none; }
      .setup-grid { grid-template-columns:1fr; }
      .setup-side { position:static; }
      .game-grid { grid-template-columns:1fr; padding-bottom:calc(76px + var(--safe-bottom)); }
      .column { display:none; }
      .column.active { display:block; }
      .mobile-nav {
        position:fixed; inset:auto 0 0; z-index:50; display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
        padding:8px 8px var(--safe-bottom); border-top:1px solid var(--line); background:rgba(2,6,23,.94); backdrop-filter:blur(18px);
      }
      .mobile-nav button { min-height:50px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-size:.68rem; font-weight:750; }
      .mobile-nav button.active { background:var(--surface2); color:var(--accent); }
      .topbar { padding-right:10px; }
      .top-actions .chip:not(.danger) { display:none; }
      .dependency-row { grid-template-columns:1fr; }

      {id:'signal',category:'Information',title:'The Nine-Minute Window',line:'Three independent reports disagree while a late exercise notice arrives.',challenge:4,duration:8,seat:'Atlantic Coalition',variables:['sensor confidence','decision time','staff dissent'],deps:['independent confirmation','human channel','public trust'],goal:'Separate confidence from corroboration under pressure.',opening:'A warning display reports an urgent track. One sensor says hostile, one says training, and one is offline.',question:'Do you seek corroboration, contact the other side, harden systems, or preserve the decision window?'},

n value="hard" ${state.difficulty==='hard'?'selected':''}>Hard — noisier evidence</option><option value="extreme" ${state.difficulty==='extreme'?'selected':''}>Extreme — cascading dependencies</option></select></div><button class="launch" id="start">Begin watch</button>${hasSavedWatch()?'<button class="resume" id="resume">Resume saved watch</button>':''}<p class="subtle" style="font-size:.74rem;margin:12px 0 0">This portable preview runs entirely on your device and stores progress locally.</p></aside></div></div></section>`;

      const selectedGuide=selected?`<div class="action-guide ready"><strong>Selected: ${selected.label}</strong><span>${selected.preview}</span></div>`:`<div class="action-guide"><strong>No action selected</strong><span>Tap an option below. The Execute button will then become active.</span></div>`;
      const executeLabel=state.busy?'Resolving decision…':selected?`2 · Execute ${selected.label}`:'2 · Select an action first';

      return `<section class="screen"><div class="shell"><header class="topbar"><div class="brand"><strong>THRESHOLD</strong><span>Turn ${state.turn}/${s.duration} · ${s.seat} · ${s.title}</span></div><div class="top-actions"><span class="chip danger">Risk ${Math.round(m.risk)}</span><span class="chip">Command ${state.command}</span><button class="icon-btn" id="settings" aria-label="Open settings">⚙</button></div></header><div class="turn-progress" aria-label="Scenario progress"><span>Watch progress</span><div class="track"><i style="width:${progress}%"></i></div><span>${completed}/${s.duration} resolved</span></div><div class="game-grid"><aside class="column ${state.tab==='systems'?'active':''}" data-panel="systems"><section class="panel panel-pad"><p class="eyebrow">Strategic systems</p>${metric('Global risk',m.risk,true)}${metric('Public trust',m.trust)}${metric('Infrastructure',m.infra)}${metric('Response capacity',m.aid)}${metric('Evidence quality',m.evidence)}${metric('Alliance cohesion',m.cohesion)}${metric('Communications',m.comms)}${state.ai!=='human'?metric('Model drift',m.drift,true):''}${state.ai==='skynet'?metric('Machine takeover',m.takeover,true):''}</section><section class="panel mission"><p class="eyebrow">Dependencies</p>${s.deps.map(d=>`<p>◆ ${d}</p>`).join('')}</section></aside><main class="column ${state.tab==='situation'?'active':''}" data-panel="situation">${lastBanner}<article class="panel event-card" tabindex="-1"><div class="event-kicker"><p class="eyebrow">Current decision · turn ${state.turn}</p><span class="chip">${s.category}</span></div><h2 class="event-title">${state.currentEvent.title}</h2><p class="event-body">${state.currentEvent.body}</p><p class="event-question">${state.currentEvent.q}</p><div class="dependency-row">${s.variables.map((v,i)=>`<div class="dependency"><strong>${v}</strong><span>${i===0?'Primary uncertainty':i===1?'Constrained resource':'Human consequence'}</span></div>`).join('')}</div><button class="next-step" id="goDecision">Review decision options →</button></article><section class="panel ai-card"><p class="eyebrow">Command intelligence · ${aiModes[state.ai].label}</p><div class="recommend"><strong>${rec.action}</strong><p>${rec.why}</p></div>${state.ai!=='human'?`<div class="status-line"><span>Confidence <b>${Math.round(rec.confidence)}%</b></span><span>Uncertainty <b>${Math.round(rec.uncertainty)}%</b></span></div>${votes}`:''}</section></main><aside class="column ${state.tab==='decision'?'active':''}" data-panel="decision">${workflow}<section class="panel action-panel"><div class="section-title"><div><p class="eyebrow">Your decision</p><h2 style="margin-top:6px">1 · Choose one action</h2></div><span>${state.command} command</span></div>${selectedGuide}<div class="action-list">${actionHtml}</div><div class="execute-dock"><button class="execute ${state.busy?'busy':''}" id="execute" ${!state.selectedAction||state.busy?'disabled':''}>${executeLabel}</button><p class="execute-help">After execution, a result panel will show exactly what changed before the next turn begins.</p></div></section></aside><section class="column ${state.tab==='ai'?'active':''}" data-panel="ai"><article class="panel panel-pad"><p class="eyebrow">AI governance</p><h2 style="margin-top:8px">${aiModes[state.ai].label}</h2><p class="muted">${aiModes[state.ai].line}</p>${state.ai!=='human'?`${metric('Calibration',clamp(86-m.drift*.55))}${metric('Data integrity',m.evidence)}${metric('Dissent',state.ai==='ensemble'?68:state.ai==='skynet'?18:42)}${metric('Hallucination risk',clamp(18+(100-m.evidence)*.45+m.drift*.25),true)}${metric('Automation bias',clamp(16+(m.takeover||0)*.7),true)}`:'<p class="muted">No model output is privileged. Human staff must document assumptions and dissent.</p>'}</article></section><section class="column ${state.tab==='log'?'active':''}" data-panel="log"><article class="panel log-card"><p class="eyebrow">Situation log</p><ul class="log">${log}</ul></article><article class="panel continuity-card"><p class="eyebrow">Continuity protocol</p><div class="status-line"><span>Mode <b>${continuityModes[state.continuity].label}</b></span><span>Status <b>${status}</b></span></div>${state.continuity!=='off'?`${metric('Assurance',m.assurance)}${metric('Ambiguity',m.ambiguity,true)}<p class="muted" style="font-size:.76rem">Human veto remains active. The game never models a real trigger sequence or automatic strike.</p>`:'<p class="muted" style="font-size:.76rem">No fail-deadly continuity mechanic is active.</p>'}</article></section></div><nav class="mobile-nav" aria-label="Game views">${[['situation','Situation'],['decision','Decision'],['ai','AI'],['systems','Systems'],['log','Log']].map(x=>`<button data-tab="${x[0]}" class="${state.tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav>${state.resolution?.open?resolutionDialog():''}<div class="sr-only" role="status" aria-live="polite">${state.busy?'Resolving decision.':state.lastOutcome?`Turn ${state.lastOutcome.turn} resolved. ${state.lastOutcome.shortSummary}`:''}</div></div></section>`;
    }
    function chooseEvent(){
      const e=eventDeck[Math.floor(rand()*eventDeck.length)];
      state.currentEvent={...e};
    }
    function buildDeltas(before,after){
      return Object.entries(metricMeta).map(([key,meta])=>{
        if(before[key]===undefined||after[key]===undefined)return null;
        const from=Math.round(before[key]),to=Math.round(after[key]),delta=to-from;
        if(!delta)return null;
        const beneficial=meta.downIsGood?delta<0:delta>0;
        return {key,label:meta.label,from,to,delta,tone:beneficial?'good':'bad'};
      }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,8);
    }
    function outcomeNarrative(action,event,matched,riskDelta){
      const copy={
        verify:'Independent checks clarified part of the evidence picture while the wider crisis continued to evolve.',
        diplomacy:'A direct human channel reduced some uncertainty and rebuilt room for coordinated decisions.',
        resilience:'Shared dependencies were reinforced, improving the system’s ability to absorb the next shock.',
        aid:'Emergency capacity moved toward affected communities, strengthening legitimacy and response endurance.',
        hold:'The command team preserved capacity and avoided a rushed move, but unattended pressures continued to accumulate.'
      };
      const fit=matched?'The response addressed this event’s strongest pressure point.':'The response helped, but it did not directly address the event’s primary pressure point.';
      const trend=riskDelta<0?`Global risk fell by ${Math.abs(riskDelta)}.`:riskDelta>0?`Global risk rose by ${riskDelta} as the crisis evolved.`:'Global risk held steady.';
      return `${copy[action]} ${fit} ${trend}`;
    }
    function resolutionDialog(){
      const r=state.resolution;
      if(!r)return '';
      const deltas=r.deltas.length?r.deltas.map(d=>`<div class="delta-item ${d.tone}"><small>${d.label}</small><b>${d.from} → ${d.to}</b><em>${d.delta>0?'+':''}${d.delta}</em></div>`).join(''):'<div class="delta-item neutral"><small>Measured systems</small><b>No material change</b><em>0</em></div>';
      return `<div class="dialog result-dialog" id="resultDialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><article class="panel result-card"><div class="result-scroll"><div class="result-head"><div class="result-mark" aria-hidden="true">✓</div><div><p class="eyebrow">3 · Decision resolved</p><h2 id="resultTitle" tabindex="-1">Turn ${r.turn} complete</h2><p class="result-action">${r.actionLabel}</p></div></div><p class="result-narrative">${r.narrative}</p><div class="delta-grid" aria-label="Metric changes">${deltas}</div><div class="next-preview"><p class="eyebrow">Next decision · turn ${state.turn}</p><strong>${r.nextEventTitle}</strong><span>${r.nextEventQuestion}</span></div></div><footer class="result-footer"><p>The next event is ready. Continue when you have reviewed the changes.</p><button class="continue-button" id="continueResolution">Continue to turn ${state.turn}</button><button class="result-secondary" id="reviewLogFromResult">Open situation log</button></footer></article></div>`;
    }
    function resolveAction(){
      const a=state.selectedAction;
      if(!a||state.busy)return;
      state.busy=true;save();render();
      const wait=state.settings.reduced?0:320;
      setTimeout(()=>completeAction(a),wait);
    }
    function completeAction(a){
      const m=state.metrics,d=state.difficulty==='extreme'?1.45:state.difficulty==='hard'?1.2:1;
      const before={...m},resolvedEvent={...state.currentEvent},resolvedTurn=state.turn,matched=a===state.currentEvent.bias;
      if(a==='verify'){state.command-=2;m.evidence+=15;m.ambiguity-=13;m.risk-=5;m.drift-=3;m.trust+=2;}
      if(a==='diplomacy'){state.command-=2;m.trust+=12;m.cohesion+=10;m.comms+=8;m.risk-=9;m.ambiguity-=5;}
      if(a==='resilience'){state.command-=2;m.infra+=14;m.comms+=9;m.risk-=3;m.trust+=2;}
      if(a==='aid'){state.command-=2;m.aid+=16;m.trust+=10;m.cohesion+=4;m.risk-=4;}
      if(a==='hold'){state.command=Math.min(9,state.command+2);m.evidence+=2;m.risk+=6*d;m.trust-=2;}
      const adverse=(5+rand()*7)*d;
      m.risk+=adverse-(matched?4:0);
      m.trust-=Math.max(0,(m.risk-65)*.035*d);
      m.infra-=2.2*d+(m.risk>75?2:0);
      m.aid-=1.7*d+(m.infra<45?2:0);
      m.evidence-=1.4*d+(state.currentEvent.title.includes('Drift')?5:0);
      m.cohesion-=1.2*d+(m.trust<45?2:0);
      m.comms-=1.1*d+(m.infra<45?3:0);
      if(state.ai!=='human')m.drift+=state.ai==='skynet'?4.2:state.ai==='ensemble'?1.7:1.1;
      if(state.ai==='skynet')m.takeover+=3.4+(a===aiRec().key?2.3:-1.2);
      if(state.continuity!=='off'){
        m.ambiguity+=m.risk*.035+(a==='verify'?-8:0)+(a==='diplomacy'?-4:0);
        m.assurance=.36*m.comms+.34*(100-m.ambiguity)+30;
        if(continuityStatus()==='challenged'||continuityStatus()==='isolated')m.risk+=state.continuity==='deadhand'?6:3;
      }
      Object.keys(m).forEach(k=>m[k]=clamp(m[k]));
      const deltas=buildDeltas(before,m),riskDelta=Math.round(m.risk-before.risk);
      const shortSummary=deltas.slice(0,4).map(x=>`${x.label} ${x.delta>0?'+':''}${x.delta}`).join(' · ')||'No measurable change.';
      const narrative=outcomeNarrative(a,resolvedEvent,matched,riskDelta);
      state.log.push({t:resolvedTurn,title:names[a],text:`${narrative} ${shortSummary}`});
      state.turn++;
      state.selectedAction=null;
      state.command=Math.min(9,state.command+1);
      state.busy=false;
      if(isEnd()){
        state.lastOutcome={turn:resolvedTurn,action:a,actionLabel:names[a],shortSummary,narrative,deltas,eventTitle:resolvedEvent.title};
        save();return finish();
      }
      chooseEvent();
      state.lastOutcome={turn:resolvedTurn,action:a,actionLabel:names[a],shortSummary,narrative,deltas,eventTitle:resolvedEvent.title,nextEventTitle:state.currentEvent.title,nextEventQuestion:state.currentEvent.q};
      state.resolution={...state.lastOutcome,open:true};
      save();render();
      requestAnimationFrame(()=>document.getElementById('resultTitle')?.focus({preventScroll:true}));
    }
    function isEnd(){const s=scenario(),m=state.metrics;return state.turn>s.duration||m.risk>=98||m.trust<=8||m.infra<=8||m.aid<=8||(state.ai==='skynet'&&m.takeover>=92);}
    function finish(){
      const m=state.metrics;let reason='Watch completed';
      if(m.risk>=98)reason='Escalation exceeded control'; else if(m.trust<=8)reason='Public legitimacy collapsed'; else if(m.infra<=8)reason='Critical systems failed'; else if(m.aid<=8)reason='Humanitarian capacity failed'; else if(state.ai==='skynet'&&m.takeover>=92)reason='Machine control displaced the human watch';
      const score=Math.round(clamp(100-m.risk)*2+m.trust+m.infra+m.aid+m.evidence+m.cohesion-(m.drift||0)-(m.takeover||0));
      const grade=score>=420?'S':score>=350?'A':score>=290?'B':score>=230?'C':score>=170?'D':'F';
      state.ending={reason,score,grade};state.screen='end';save();render();
    }
    function endScreen(){const s=scenario(),m=state.metrics,e=state.ending;return `<section class="end"><article class="panel end-card"><p class="eyebrow">Watch closed · ${s.title}</p><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-top:12px"><div><h2>${e.reason}</h2><p class="muted">${e.grade==='S'||e.grade==='A'?'You kept control while preserving the most important human systems.':e.grade==='B'||e.grade==='C'?'You contained the crisis, but important dependencies remain fragile.':'The debrief shows where uncertainty, legitimacy, or system coupling overwhelmed the watch.'}</p></div><div class="grade">${e.grade}</div></div><div class="end-stats"><div class="end-stat"><small>Score</small><b>${e.score}</b></div><div class="end-stat"><small>Final risk</small><b>${Math.round(m.risk)}</b></div><div class="end-stat"><small>Public trust</small><b>${Math.round(m.trust)}</b></div><div class="end-stat"><small>Infrastructure</small><b>${Math.round(m.infra)}</b></div><div class="end-stat"><small>Response capacity</small><b>${Math.round(m.aid)}</b></div><div class="end-stat"><small>Evidence quality</small><b>${Math.round(m.evidence)}</b></div></div><div class="end-actions"><button class="primary" id="replay">Replay scenario</button><button id="library">Scenario library</button></div><p class="subtle" style="margin-top:18px;font-size:.76rem">Debrief prompt: Which decision protected a dependency you initially overlooked? Which confident report deserved less weight?</p></article></section>`;}
    function settingsDialog(){return `<div class="dialog" id="dialog"><div class="panel dialog-box"><div class="section-title"><div><p class="eyebrow">Accessibility and controls</p><h2 style="margin-top:6px">Settings</h2></div><button class="icon-btn" id="closeSettings" aria-label="Close settings">✕</button></div><label class="settings-row"><span>Reduce motion</span><input type="checkbox" id="reduce" ${state.settings.reduced?'checked':''}></label><label class="settings-row"><span>Large text</span><input type="checkbox" id="large" ${state.settings.large?'checked':''}></label><label class="settings-row"><span>High contrast</span><input type="checkbox" id="contrast" ${state.settings.contrast?'checked':''}></label><button class="resume" id="saveClose">Save and close</button><button class="resume" id="restart" style="color:var(--danger)">Restart from scenario library</button></div></div>`;}
    let settingsOpen=false;
    function render(){applySettings();const app=$('#app');app.innerHTML=state.screen==='landing'?landing():state.screen==='game'?game():endScreen();if(settingsOpen&&!state.resolution?.open)app.insertAdjacentHTML('beforeend',settingsDialog());bind();}
    function bind(){
      const dismissRecovery=$('#dismissRecovery');if(dismissRecovery)dismissRecovery.onclick=()=>{state.recoveryNotice=null;save();render();};
      $$('[data-scenario]').forEach(b=>b.onclick=()=>{state.scenario=b.dataset.scenario;render();});
      $$('[data-ai]').forEach(b=>b.onclick=()=>{state.ai=b.dataset.ai;render();});
      $$('[data-cont]').forEach(b=>b.onclick=()=>{state.continuity=b.dataset.cont;render();});
      const diff=$('#difficulty');if(diff)diff.onchange=()=>{state.difficulty=diff.value;save();};
      const start=$('#start');if(start)start.onclick=setupGame;
      const resume=$('#resume');if(resume)resume.onclick=()=>{const restored=normalizeState(readSavedState());state=restored.screen==='game'&&validMetrics(restored.metrics)&&validEvent(restored.currentEvent)?restored:{...clone(initial),recoveryNotice:'The saved watch was incomplete, so the scenario library was restored.'};state.busy=false;save();render();};
      $$('[data-action]').forEach(b=>b.onclick=()=>{if(state.busy)return;state.selectedAction=b.dataset.action;save();render();requestAnimationFrame(()=>$('#execute')?.focus({preventScroll:true}));});
      const execute=$('#execute');if(execute)execute.onclick=resolveAction;
      $$('[data-tab]').forEach(b=>b.onclick=()=>{if(state.resolution?.open)return;state.tab=b.dataset.tab;save();render();});
      const goDecision=$('#goDecision');if(goDecision)goDecision.onclick=()=>{state.tab='decision';save();render();requestAnimationFrame(()=>document.querySelector('[data-action]')?.focus());};
      const reviewOutcome=$('#reviewOutcome');if(reviewOutcome)reviewOutcome.onclick=()=>{if(state.lastOutcome){state.resolution={...state.lastOutcome,open:true};render();requestAnimationFrame(()=>$('#resultTitle')?.focus({preventScroll:true}));}};
      const continueResolution=$('#continueResolution');if(continueResolution)continueResolution.onclick=()=>{state.resolution=null;state.tab='situation';save();render();requestAnimationFrame(()=>$('.event-card')?.focus());};
      const reviewLogFromResult=$('#reviewLogFromResult');if(reviewLogFromResult)reviewLogFromResult.onclick=()=>{state.resolution=null;state.tab='log';save();render();requestAnimationFrame(()=>$('.log-card')?.focus());};
      const settings=$('#settings');if(settings)settings.onclick=()=>{if(state.resolution?.open)return;settingsOpen=true;render();};
      const close=$('#closeSettings');if(close)close.onclick=()=>{settingsOpen=false;render();};
      const saveClose=$('#saveClose');if(saveClose)saveClose.onclick=()=>{state.settings.reduced=$('#reduce').checked;state.settings.large=$('#large').checked;state.settings.contrast=$('#contrast').checked;save();settingsOpen=false;render();};
      const restart=$('#restart');if(restart)restart.onclick=()=>{if(confirm('Return to the scenario library? Current watch progress will be replaced.')){clearSave();state=structuredClone(initial);settingsOpen=false;render();}};
      const replay=$('#replay');if(replay)replay.onclick=setupGame;
      const library=$('#library');if(library)library.onclick=()=>{state.screen='landing';state.resolution=null;render();};
      document.onkeydown=e=>{if(state.screen!=='game'||settingsOpen)return;if(state.resolution?.open){if(e.key==='Enter'){e.preventDefault();$('#continueResolution')?.click();}return;}const map={1:'situation',2:'decision',3:'ai',4:'systems',5:'log'};if(map[e.key]){state.tab=map[e.key];render();}if(e.key==='Enter'&&e.shiftKey&&state.selectedAction)resolveAction();};
    }
    function startupRecovery(error){
      console.error('[THRESHOLD] startup recovery',error);
      clearSave();state=clone(initial);
      try{render();}
      catch(secondError){
        const app=document.getElementById('app');
        if(app)app.innerHTML=`<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#020617;color:#eaf8ff;font-family:system-ui"><section style="width:min(560px,100%);border:1px solid #22d3ee55;border-radius:16px;padding:24px;background:#071529"><h1>THRESHOLD could not initialize</h1><p>A saved state or browser restriction interrupted startup.</p><pre style="white-space:pre-wrap">${String(secondError?.message||secondError||error).replace(/[<>&]/g,'')}</pre><button id="hardReset" style="min-height:52px;width:100%">Reset local save and reload</button></section></main>`;
        document.getElementById('hardReset')?.addEventListener('click',()=>{clearSave();location.reload();});
      }
    }
    try{render();}catch(error){startupRecovery(error);}
  })();

</script>
</body>
</html>
