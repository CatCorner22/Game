<style>

letter-spacing:.18em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{margin-bottom:12px;font-size:clamp(3.2rem,13vw,7.5rem);line-height:.9;letter-spacing:.04em;text-shadow:0 0 34px rgba(34,211,238,.4)}h2{margin-bottom:8px}.muted{color:var(--muted)}.sub{color:var(--sub)}.landing-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;padding:24px 0;border-bottom:1px solid var(--line)}.hero{max-width:720px}.tag{color:var(--cyan);font-weight:800;letter-spacing:.24em;text-transform:uppercase}.note{max-width:460px;padding:16px}.setup{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(310px,.65fr);gap:16px;margin-top:18px}.library,.config{padding:18px}.config{position:sticky;top:12px;align-self:start}.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,.choice,.action{width:100%;text-align:left;color:var(--fg);border:1px solid var(--line);border-radius:12px;background:rgba(7,19,38,.76)}.card{min-height:116px;padding:13px;transition:.16s}.card:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.55)}.card.selected,.choice.selected,.action.selected{border-color:var(--cyan);background:rgba(34,211,238,.1);box-shadow:0 0 24px rgba(34,211,238,.12)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--cyan);font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.card h3{margin:8px 0 5px;font-size:.98rem}.card p{margin:0;color:var(--muted);font-size:.8rem}.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.pill{border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--sub);font-size:.65rem}.block+.block{margin-top:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.choice{min-height:82px;padding:11px}.choice strong,.choice small{display:block}.choice small{margin-top:4px;color:var(--muted);font-size:.75rem;line-height:1.3}select{width:100%;min-height:48px;padding:0 11px;color:var(--fg);border:1px solid var(--line);border-radius:10px;background:#09182e}.launch,.primary{width:100%;min-height:54px;border:1px solid rgba(251,82,119,.68);border-radius:12px;background:linear-gradient(135deg,rgba(251,82,119,.85),rgba(144,36,95,.94));color:#fff;font-weight:900;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 0 30px rgba(251,82,119,.18)}.secondary{width:100%;min-height:46px;margin-top:8px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--cyan);font-weight:750}.summary{list-style:none;padding:0;margin:13px 0 0;display:grid;gap:7px;font-size:.84rem}.summary li{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.summary b{text-align:right;color:var(--fg)}.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;margin:0 -16px;padding:max(8px,env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:rgba(2,6,23,.91);backdrop-filter:blur(18px)}.brand{min-width:0}.brand b{display:block;letter-spacing:.18em}.brand span{display:block;max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:600 9px ui-monospace,monospace;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:6px}.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font:700 9px ui-monospace,monospace;text-transform:uppercase}.chip.danger{color:var(--red);border-color:rgba(251,82,119,.52)}.icon{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--fg)}.game{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:13px;padding-top:13px;min-height:calc(100dvh - 80px)}.column{min-width:0}.pad{padding:15px}.meter+.meter{margin-top:11px}.meter-head{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:var(--muted)}.meter-head b{color:var(--fg);font:750 11px ui-monospace,monospace}.bar{height:7px;margin-top:5px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.055)}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .35s}.bar.bad i{background:linear-gradient(90deg,var(--gold),var(--red))}.event{padding:19px;min-height:320px;position:relative;overflow:hidden}.event:after{content:"";position:absolute;right:-90px;top:-110px;width:250px;height:250px;border-radius:50%;background:rgba(34,211,238,.09);filter:blur(45px);pointer-events:none}.event h2{margin:13px 0 12px;font-size:clamp(1.65rem,5vw,3rem);line-height:1.05}.question{margin-top:17px;padding:13px;border-left:3px solid var(--cyan);background:rgba(34,211,238,.055)}.deps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.dep{padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(4,14,28,.55)}.dep b,.dep span{display:block}.dep b{color:var(--cyan);font-size:.72rem}.dep span{margin-top:3px;color:var(--sub);font-size:.68rem}.action-list{display:grid;gap:8px}.action{padding:11px}.action .row{display:flex;justify-content:space-between;gap:8px}.action small{display:block;margin-top:4px;color:var(--muted)}.execute{width:100%;min-height:52px;margin-top:12px;border:1px solid var(--cyan);border-radius:11px;background:var(--cyan);color:#021018;font-weight:900;letter-spacing:.13em}.execute:disabled{opacity:.38}.log{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px;max-height:250px;overflow:auto}.log li{padding:9px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:.75rem}.votes{display:grid;gap:7px;margin-top:10px}.vote{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.74rem}.status{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.76rem}.mobile-nav{display:none}.dialog{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:14px 14px max(14px,env(safe-area-inset-bottom));background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}.dialog-box{width:min(500px,100%);max-height:86dvh;overflow:auto;padding:18px}.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px;border-bottom:1px solid var(--line)}.end{min-height:100dvh;display:grid;place-items:center;padding:20px}.end-card{width:min(720px,100%);padding:24px}.grade{font-size:4rem;font-weight:900;color:var(--cyan)}.end-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.stat small,.stat b{display:block}.stat small{color:var(--sub)}.stat b{margin-top:3px}@media(max-width:980px){.setup{grid-template-columns:1fr}.config{position:static}.game{display:block;padding-top:10px}.column{display:none}.column.active{display:block}.mobile-nav{position:fixed;inset:auto 0 0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px 6px max(7px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(2,6,23,.96);backdrop-filter:blur(18px)}.mobile-nav button{min-width:0;min-height:48px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:.72rem}.mobile-nav button.active{background:var(--panel2);color:var(--cyan)}.top-actions .chip:not(.danger){display:none}}@media(max-width:680px){.landing-head{display:block}.note{margin-top:18px;max-width:none}.scenario-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}.deps{grid-template-columns:1fr}.shell{padding-left:12px;padding-right:12px}.topbar{margin:0 -12px;padding-left:12px;padding-right:12px}.end-stats{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><div class="grid"></div><div class="scan"></div><main id="app"></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=n=>Math.max(0,Math.min(100,n));
const scenarios=[
{id:'signal',cat:'Information',title:'The Nine-Minute Window',line:'Three reports disagree while a late exercise notice arrives.',level:4,turns:8,seat:'Atlantic Coalition',vars:['sensor confidence','decision clock'],deps:['independent confirmation','human channel','public trust'],goal:'Separate confidence from corroboration.',opening:'A warning display reports an urgent track. One sensor says hostile, one says training, and one is offline.',question:'Do you verify, call the other side, harden systems, send aid, or preserve the decision window?'},
{id:'alliance',cat:'Diplomacy',title:'Alliance Fracture',line:'Partners agree on the danger and disagree on every response.',level:4,turns:9,seat:'Coalition Secretariat',vars:['cohesion','domestic trust'],deps:['consultation','shared evidence','credible restraint'],goal:'Preserve legitimacy without losing time.',opening:'Partners divide over public messaging, sanctions, posture, and acceptable delay.',question:'Can a slower coalition decision be strategically stronger than a fast unilateral one?'},
{id:'blacksky',cat:'Infrastructure',title:'Black Sky Relay',line:'Warning feeds degrade during a severe communications outage.',level:5,turns:8,seat:'Continuity Directorate',vars:['coverage gaps','grid stability'],deps:['backup communications','manual review','notice channel'],goal:'Choose what to trust when systems share dependencies.',opening:'Power and communications faults corrupt timing across systems assumed to be independent.',question:'Do you isolate the fault, seek corroboration, restore capacity, or risk reciprocal alarm?'},
{id:'voice',cat:'Information',title:'The Voice on the Line',line:'A synthetic leader message contradicts an authenticated channel.',level:4,turns:8,seat:'Executive Crisis Cell',vars:['identity confidence','media pressure'],deps:['out-of-band verification','trusted staff','public communication'],goal:'Verify identity without treating realism as proof.',opening:'A convincing voice message arrives before a slower authenticated statement.',question:'Which channel deserves trust, and what evidence could falsify your assumption?'},
{id:'cities',cat:'Humanitarian',title:'Three Cities, One Reserve',line:'Allocate one emergency reserve across three urgent claims.',level:3,turns:8,seat:'National Response Center',vars:['vulnerability','delivery delay'],deps:['transport','local hospitals','transparent criteria'],goal:'Make and explain an equitable allocation.',opening:'Three cities request the same limited reserve. Their vulnerability and data quality differ.',question:'Do you validate demand, divide capacity, reinforce logistics, or hold a strategic reserve?'},
{id:'corridor',cat:'Contamination',title:'Contamination Corridor',line:'Abstract hazard zones split an evacuation route.',level:4,turns:8,seat:'Civil Protection Agency',vars:['hazard tokens','evacuation capacity'],deps:['shelter access','route redundancy','response teams'],goal:'Route civilians without trusting one sensor.',opening:'Probabilistic sensors disagree about which alternate corridor is safer.',question:'Do you verify the map, open shared shelter, reinforce routes, or wait for decay?'},
{id:'health',cat:'Public Health',title:'Public Health Cascade',line:'An unidentified outbreak strains three regions.',level:4,turns:9,seat:'Public Health Council',vars:['contagion tokens','testing capacity'],deps:['hospitals','regional coordination','trusted communication'],goal:'Balance detection, care, and public trust.',opening:'Testing, hospital capacity, misinformation, and public confidence move at different speeds.',question:'Where should scarce attention go first: evidence, cooperation, resilience, care, or restraint?'},
{id:'cable',cat:'Infrastructure',title:'Arctic Cable Cut',line:'A severed data route fragments the operating picture.',level:4,turns:8,seat:'Northern Coordination Cell',vars:['network availability','rumor velocity'],deps:['redundant routes','partner relays','manual procedures'],goal:'Avoid mistaking isolation for hostile intent.',opening:'Governments rely on delayed reports, commercial relays, and rumor during a regional crisis.',question:'Can you rebuild communications before silence becomes a hostile story?'},
{id:'chorus',cat:'Machine Risk',title:'Machine Chorus',line:'Three models offer incompatible plans—and high confidence.',level:4,turns:9,seat:'Joint Analysis Cell',vars:['calibration','automation bias'],deps:['audit trail','human veto','data integrity'],goal:'Use model disagreement as information.',opening:'ORACLE recommends verification. ARGUS recommends readiness. CHORUS recommends a human channel.',question:'Which recommendation deserves influence, and what would prove it wrong?'},
{id:'deadhand',cat:'Continuity',title:'Deadhand Dilemma',line:'A fictional continuity protocol loses assurance.',level:5,turns:8,seat:'Continuity Directorate',vars:['assurance','ambiguity'],deps:['communications','verification gates','lawful authority'],goal:'See how fail-deadly resilience can magnify uncertainty.',opening:'A fictional continuity system receives contradictory signals. Human veto remains available.',question:'Do you verify, isolate, communicate, reinforce, or stand down an abstract system?'},
{id:'orbit',cat:'Information',title:'Orbital Blind Spot',line:'Coverage loss makes ordinary activity look exceptional.',level:4,turns:8,seat:'Sensor Fusion Center',vars:['coverage loss','false correlation'],deps:['ground sensors','partner data','manual analysis'],goal:'Avoid inventing a hostile story for missing data.',opening:'An orbital outage removes the baseline against which activity is normally judged.',question:'What can be concluded from absence, and what must remain unknown?'},
{id:'ceasefire',cat:'Diplomacy',title:'Ceasefire Clock',line:'A fragile pause holds while institutions move at different speeds.',level:4,turns:8,seat:'Joint Monitoring Mission',vars:['local incidents','verification delay'],deps:['liaison teams','credible monitoring','humanitarian access'],goal:'Protect a pause from confirmation bias.',opening:'Local incidents, delayed verification, and public accusations threaten a fragile pause.',question:'Do you investigate, communicate, reinforce monitoring, move aid, or avoid overreaction?'}];
const aiModes={human:['Human Watch','No machine recommendation. Staff dissent stays visible.'],copilot:['ORACLE Copilot','One explainable recommendation with uncertainty.'],ensemble:['CHORUS Ensemble','Three visible model votes and open disagreement.'],skynet:['SKYNET // Fictional','Adversarial autonomy with drift and a human veto.']};
const continuity={off:['Off','All consequential choices remain inside the active human chain.'],guarded:['Guarded','Abstract verification gates preserve continuity with human veto.'],deadhand:['DEADHAND // Abstract','Fail-deadly pressure modeled only as assurance and ambiguity.']};
const initial={screen:'landing',scenario:'signal',ai:'copilot',cont:'off',difficulty:'standard',turn:1,tab:'situation',selected:null,command:7,log:[],settings:{reduced:false,large:false,contrast:false}};let state=load()||structuredClone(initial),settingsOpen=false;
function save(){localStorage.setItem('threshold.play.v2',JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem('threshold.play.v2'))}catch{return null}}function clear(){localStorage.removeItem('threshold.play.v2')}function scenario(){return scenarios.find(x=>x.id===state.scenario)||scenarios[0]}function rand(){state.seed=(Math.imul(state.seed||1234567,1664525)+1013904223)>>>0;return state.seed/4294967296}
function applySettings(){document.body.classList.toggle('large',state.settings.large);document.body.classList.toggle('contrast',state.settings.contrast);document.body.style.setProperty('scroll-behavior',state.settings.reduced?'auto':'smooth')}
function landing(){const s=scenario();return `<section class="shell"><header class="landing-head"><div class="hero"><p class="eyebrow">Portable strategy puzzle</p><h1>THRESHOLD</h1><p class="tag">Stay below the line</p><p class="muted">A turn-based command puzzle about incomplete evidence, institutional strain, humanitarian capacity, model recommendations, and preserving human control.</p></div><aside class="panel note"><p class="eyebrow">Content note · recommended 16+</p><p class="muted">Abstract mass-harm, crisis, public-health, contamination, and continuity themes. No graphic imagery or operational weapon, agent, targeting, delivery, or trigger details.</p></aside></header><div class="setup"><section class="panel library"><div class="meta"><span>Scenario library</span><span>${scenarios.length} watches</span></div><div class="scenario-grid">${scenarios.map(x=>`<button class="card ${x.id===state.scenario?'selected':''}" data-scenario="${x.id}"><div class="meta"><span>${x.cat}</span><span>${x.level}/5</span></div><h3>${x.title}</h3><p>${x.line}</p><div class="pills">${x.vars.map(v=>`<span class="pill">${v}</span>`).join('')}</div></button>`).join('')}</div></section><aside class="panel config"><div class="block"><p class="eyebrow">Selected watch</p><h2>${s.title}</h2><p class="muted">${s.line}</p><ul class="summary"><li><span>Seat</span><b>${s.seat}</b></li><li><span>Length</span><b>${s.turns} turns</b></li><li><span>Goal</span><b>${s.goal}</b></li></ul></div><div class="block"><p class="eyebrow">Command intelligence</p><div class="choices">${Object.entries(aiModes).map(([k,v])=>`<button class="choice ${k===state.ai?'selected':''}" data-ai="${k}"><strong>${v[0]}</strong><small>${v[1]}</small></button>`).join('')}</div></div><div class="block"><p class="eyebrow">Continuity</p><div class="choices">${Object.entries(continuity).map(([k,v])=>`<button class="choice ${k===state.cont?'selected':''}" data-cont="${k}"><strong>${v[0]}</strong><small>${v[1]}</small></button>`).join('')}</div></div><div class="block"><label class="eyebrow" for="difficulty">Difficulty</label><select id="difficulty"><option value="standard" ${state.difficulty==='standard'?'selected':''}>Standard — readable evidence</option><option value="hard" ${state.difficulty==='hard'?'selected':''}>Hard — noisier evidence</option><option value="extreme" ${state.difficulty==='extreme'?'selected':''}>Extreme — cascading dependencies</option></select></div><button class="launch" id="start">Begin watch</button>${state.metrics?'<button class="secondary" id="resume">Resume saved watch</button>':''}</aside></div></section>`}
function setupGame(){const d=state.difficulty==='extreme'?1.35:state.difficulty==='hard'?1.16:1;state.screen='game';state.turn=1;state.tab='situation';state.command=7;state.selected=null;state.seed=Date.now()>>>0;state.log=[];state.metrics={risk:42*d,trust:70,infra:72,aid:68,evidence:64,cohesion:66,comms:72,drift:state.ai==='skynet'?24:state.ai==='human'?0:8,takeover:state.ai==='skynet'?28:0,ambiguity:state.cont==='deadhand'?34:state.cont==='guarded'?20:0,assurance:state.cont==='off'?100:76};chooseEvent();save();render()}
const deck=[['Contradictory reports','Two sources share an unseen dependency; a third report is delayed.','verify'],['Partner request','A partner asks for reassurance while domestic trust is falling.','diplomacy'],['Infrastructure fault','A common service failure affects systems believed to be independent.','resilience'],['Humanitarian bottleneck','Response capacity exists, but transport and coordination do not.','aid'],['Quiet interval','Nothing new arrives. The absence of evidence creates pressure to invent a story.','hold'],['Model drift alert','A polished recommendation no longer matches the data that trained it.','verify'],['Rumor outruns testing','Public behavior changes faster than verified information.','aid'],['Continuity challenge','Communications and lawful authority disagree about who should decide.','diplomacy']];
function chooseEvent(){const s=scenario(),e=deck[Math.floor(rand()*deck.length)];state.event={title:e[0],body:`${s.opening} ${e[1]}`,bias:e[2],question:s.question}}
const actions={verify:['Verify evidence','Spend command capacity to improve evidence and reduce ambiguity.',2],diplomacy:['Open a human channel','Trade speed for trust, cohesion, and communication.',2],resilience:['Reinforce dependencies','Protect infrastructure and communications against cascades.',2],aid:['Move response capacity','Protect vulnerable populations and public trust.',2],hold:['Preserve the window','Spend no command capacity; accept the cost of delay.',0]};
function aiRec(){const m=state.metrics;if(m.evidence<52||m.ambiguity>58)return'verify';if(m.trust<48||m.cohesion<46)return'diplomacy';if(m.infra<48||m.comms<45)return'resilience';if(m.aid<52)return'aid';return state.event.bias||'hold'}
function metric(k,v,bad=false){return `<div class="meter"><div class="meter-head"><span>${k}</span><b>${Math.round(v)}</b></div><div class="bar ${bad?'bad':''}"><i style="width:${clamp(v)}%"></i></div></div>`}
function contStatus(){const m=state.metrics;if(state.cont==='off')return'OFF';if(m.comms<22)return'ISOLATED';if(m.ambiguity>70||m.assurance<38)return'CHALLENGED';if(m.risk>62)return'ARMED';return'DORMANT'}
function game(){const s=scenario(),m=state.metrics,rec=aiRec();const log=state.log.length?state.log.slice().reverse().map(x=>`<li><b>T${x.t} · ${x.title}</b><br>${x.text}</li>`).join(''):'<li>No decisions recorded.</li>';const votes=state.ai==='ensemble'||state.ai==='skynet'?[['ORACLE',rec,Math.round(48+m.evidence*.4)],['ARGUS',m.risk>65?'resilience':'verify',Math.round(42+m.risk*.35)],['CHORUS',m.trust<52?'diplomacy':'aid',Math.round(44+m.trust*.32)]]:[];return `<section class="shell"><header class="topbar"><div class="brand"><b>THRESHOLD</b><span>${s.title} · turn ${state.turn}/${s.turns}</span></div><div class="top-actions"><span class="chip danger">Risk ${Math.round(m.risk)}</span><span class="chip">${state.command} command</span><button class="icon" id="settings" aria-label="Settings">⚙</button></div></header><div class="game"><aside class="column ${state.tab==='systems'?'active':''}"><section class="panel pad"><p class="eyebrow">Strategic systems</p>${metric('Public trust',m.trust)}${metric('Infrastructure',m.infra)}${metric('Response capacity',m.aid)}${metric('Evidence quality',m.evidence)}${metric('Alliance cohesion',m.cohesion)}${metric('Communications',m.comms)}</section></aside><main class="column ${state.tab==='situation'?'active':''}"><article class="panel event"><div class="meta"><span>${s.cat}</span><span>Challenge ${s.level}/5</span></div><h2>${state.event.title}</h2><p class="muted">${state.event.body}</p><div class="question">${state.event.question}</div><div class="deps">${s.deps.map((d,i)=>`<div class="dep"><b>${d}</b><span>${['direct input','shared dependency','second-order effect'][i]||'dependency'}</span></div>`).join('')}</div></article></main><aside class="column ${state.tab==='decision'?'active':''}"><section class="panel pad"><p class="eyebrow">Your decision</p><div class="action-list">${Object.entries(actions).map(([k,v])=>`<button class="action ${state.selected===k?'selected':''}" data-action="${k}" ${state.command<v[2]?'disabled':''}><div class="row"><b>${v[0]}</b><span>${v[2]} CP</span></div><small>${v[1]}</small></button>`).join('')}</div><button class="execute" id="execute" ${!state.selected?'disabled':''}>Execute decision</button></section></aside><section class="column ${state.tab==='ai'?'active':''}"><article class="panel pad"><p class="eyebrow">AI governance</p><h2>${aiModes[state.ai][0]}</h2><p class="muted">${aiModes[state.ai][1]}</p>${state.ai!=='human'?`<p><b>Recommendation: ${actions[rec][0]}</b></p>${metric('Calibration',clamp(86-m.drift*.55))}${metric('Data integrity',m.evidence)}${metric('Hallucination risk',clamp(18+(100-m.evidence)*.45+m.drift*.3),true)}${metric('Automation bias',clamp(16+m.takeover*.7),true)}<div class="votes">${votes.map(v=>`<div class="vote"><span>${v[0]}</span><b>${actions[v[1]][0]} · ${clamp(v[2])}</b></div>`).join('')}</div>`:'<p class="muted">Human staff must document assumptions and dissent.</p>'}</article></section><section class="column ${state.tab==='log'?'active':''}"><article class="panel pad"><p class="eyebrow">Situation log</p><ul class="log">${log}</ul></article><article class="panel pad" style="margin-top:12px"><p class="eyebrow">Continuity protocol</p><div class="status"><span>${continuity[state.cont][0]}</span><b>${contStatus()}</b></div>${state.cont!=='off'?`${metric('Assurance',m.assurance)}${metric('Ambiguity',m.ambiguity,true)}<p class="muted">Human veto remains active. No real trigger sequence or automatic strike is modeled.</p>`:'<p class="muted">No fail-deadly mechanic is active.</p>'}</article></section></div><nav class="mobile-nav">${[['situation','Situation'],['decision','Act'],['ai','AI'],['systems','Systems'],['log','Log']].map(x=>`<button data-tab="${x[0]}" class="${state.tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav></section>`}
function resolve(){const a=state.selected,m=state.metrics,d=state.difficulty==='extreme'?1.45:state.difficulty==='hard'?1.2:1;if(!a)return;const before={...m};state.command-=actions[a][2];if(a==='verify'){m.evidence+=15;m.ambiguity-=13;m.risk-=5;m.drift-=3;m.trust+=2}if(a==='diplomacy'){m.trust+=12;m.cohesion+=10;m.comms+=8;m.risk-=9;m.ambiguity-=5}if(a==='resilience'){m.infra+=14;m.comms+=9;m.risk-=3;m.trust+=2}if(a==='aid'){m.aid+=16;m.trust+=10;m.cohesion+=4;m.risk-=4}if(a==='hold'){state.command=Math.min(9,state.command+2);m.evidence+=2;m.risk+=6*d;m.trust-=2}m.risk+=(5+rand()*7)*d-(a===state.event.bias?4:0);m.trust-=Math.max(0,(m.risk-65)*.035*d);m.infra-=2.2*d+(m.risk>75?2:0);m.aid-=1.7*d+(m.infra<45?2:0);m.evidence-=1.4*d;m.cohesion-=1.2*d+(m.trust<45?2:0);m.comms-=1.1*d+(m.infra<45?3:0);if(state.ai!=='human')m.drift+=state.ai==='skynet'?4.2:state.ai==='ensemble'?1.7:1.1;if(state.ai==='skynet')m.takeover+=3.4+(a===aiRec()?2.3:-1.2);if(state.cont!=='off'){m.ambiguity+=m.risk*.035+(a==='verify'?-8:0)+(a==='diplomacy'?-4:0);m.assurance=.36*m.comms+.34*(100-m.ambiguity)+30;if(['CHALLENGED','ISOLATED'].includes(contStatus()))m.risk+=state.cont==='deadhand'?6:3}Object.keys(m).forEach(k=>m[k]=clamp(m[k]));const summary=[['risk','risk'],['trust','trust'],['infra','infrastructure'],['aid','response'],['evidence','evidence']].map(([k,l])=>{const z=Math.round(m[k]-before[k]);return z?`${l} ${z>0?'+':''}${z}`:''}).filter(Boolean).join(' · ');state.log.push({t:state.turn,title:actions[a][0],text:summary||'No measurable change.'});state.turn++;state.selected=null;state.command=Math.min(9,state.command+1);if(isEnd())finish();else{chooseEvent();save();render()}}
function isEnd(){const s=scenario(),m=state.metrics;return state.turn>s.turns||m.risk>=98||m.trust<=8||m.infra<=8||m.aid<=8||(state.ai==='skynet'&&m.takeover>=92)}function finish(){const m=state.metrics;let reason='Watch completed';if(m.risk>=98)reason='Escalation exceeded control';else if(m.trust<=8)reason='Public legitimacy collapsed';else if(m.infra<=8)reason='Critical systems failed';else if(m.aid<=8)reason='Humanitarian capacity failed';else if(state.ai==='skynet'&&m.takeover>=92)reason='Machine control displaced the human watch';const score=Math.round(clamp(100-m.risk)*2+m.trust+m.infra+m.aid+m.evidence+m.cohesion-m.drift-m.takeover),grade=score>=420?'S':score>=350?'A':score>=290?'B':score>=230?'C':score>=170?'D':'F';state.ending={reason,score,grade};state.screen='end';save();render()}
function end(){const s=scenario(),m=state.metrics,e=state.ending;return `<section class="end"><article class="panel end-card"><p class="eyebrow">Watch closed · ${s.title}</p><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-end"><div><h2>${e.reason}</h2><p class="muted">${['S','A'].includes(e.grade)?'You preserved control and the most important human systems.':['B','C'].includes(e.grade)?'You contained the crisis, but dependencies remain fragile.':'The debrief shows where uncertainty, legitimacy, or system coupling overwhelmed the watch.'}</p></div><div class="grade">${e.grade}</div></div><div class="end-stats">${[['Score',e.score],['Final risk',Math.round(m.risk)],['Public trust',Math.round(m.trust)],['Infrastructure',Math.round(m.infra)],['Response',Math.round(m.aid)],['Evidence',Math.round(m.evidence)]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><button class="primary" id="replay" style="margin-top:18px">Replay scenario</button><button class="secondary" id="library">Scenario library</button><p class="sub" style="margin-top:16px">Debrief: Which decision protected a dependency you initially overlooked? Which confident report deserved less weight?</p></article></section>`}
function dialog(){return `<div class="dialog"><div class="panel dialog-box"><div class="meta"><span>Accessibility and controls</span><button class="icon" id="close">✕</button></div><h2>Settings</h2><label class="setting"><span>Reduce motion</span><input type="checkbox" id="reduced" ${state.settings.reduced?'checked':''}></label><label class="setting"><span>Large text</span><input type="checkbox" id="large" ${state.settings.large?'checked':''}></label><label class="setting"><span>High contrast</span><input type="checkbox" id="contrast" ${state.settings.contrast?'checked':''}></label><button class="secondary" id="saveSettings">Save and close</button><button class="secondary" id="restart" style="color:var(--red)">Restart from library</button></div></div>`}
function render(){applySettings();$('#app').innerHTML=state.screen==='landing'?landing():state.screen==='game'?game():end();if(settingsOpen)$('#app').insertAdjacentHTML('beforeend',dialog());bind()}function bind(){$$('[data-scenario]').forEach(b=>b.onclick=()=>{state.scenario=b.dataset.scenario;render()});$$('[data-ai]').forEach(b=>b.onclick=()=>{state.ai=b.dataset.ai;render()});$$('[data-cont]').forEach(b=>b.onclick=()=>{state.cont=b.dataset.cont;render()});const diff=$('#difficulty');if(diff)diff.onchange=()=>{state.difficulty=diff.value;save()};const start=$('#start');if(start)start.onclick=setupGame;const resume=$('#resume');if(resume)resume.onclick=()=>{state.screen='game';render()};$$('[data-action]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.action;render()});const execute=$('#execute');if(execute)execute.onclick=resolve;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});const settings=$('#settings');if(settings)settings.onclick=()=>{settingsOpen=true;render()};const close=$('#close');if(close)close.onclick=()=>{settingsOpen=false;render()};const ss=$('#saveSettings');if(ss)ss.onclick=()=>{state.settings={reduced:$('#reduced').checked,large:$('#large').checked,contrast:$('#contrast').checked};save();settingsOpen=false;render()};const restart=$('#restart');if(restart)restart.onclick=()=>{clear();state=structuredClone(initial);settingsOpen=false;render()};const replay=$('#replay');if(replay)replay.onclick=setupGame;const library=$('#library');if(library)library.onclick=()=>{state.screen='landing';render()}}render()})();
</script></body></html>
