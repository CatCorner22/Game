<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>THRESHOLD — Loading</title><style>html,body{margin:0;min-height:100%;background:#020617;color:#e9f7ff;font-family:system-ui,sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.spinner{width:42px;height:42px;margin:0 auto 18px;border:3px solid rgba(57,210,255,.2);border-top-color:#39d2ff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div><div class="spinner"></div><h1>Loading THRESHOLD</h1><p>Preparing the playable command simulation…</p></div></main><script>(async()=>{try{const files=["part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-08.txt","part-09.txt","part-10.txt","part-11.txt","part-12.txt","part-13.txt"];const b64=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`Unable to load ${f}`);return r.text()}))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){document.body.innerHTML='<main><div><h1>Unable to load THRESHOLD</h1><p>'+String(error)+'</p></div></main>'}})();</script></body></html>
