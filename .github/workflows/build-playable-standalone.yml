name: Build standalone playable preview

on:
  push:
    branches: [playable-preview-v2]
    paths:
      - "play/v2/**"
      - "scripts/build-playable-standalone.mjs"
      - ".github/workflows/build-playable-standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: playable-preview-v2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build one-file browser edition
        run: node scripts/build-playable-standalone.mjs

      - name: Validate standalone contract
        run: |
          test -s play/standalone/index.html
          ! grep -qi '<script src=' play/standalone/index.html
          ! grep -qi '<link rel="stylesheet"' play/standalone/index.html
          grep -q 'Begin watch' play/standalone/index.html
          grep -q 'Resolving decision' play/standalone/index.html
          grep -q 'continueResolution' play/standalone/index.html

      - name: Commit generated browser edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/standalone/index.html
          if git diff --cached --quiet; then
            echo "Standalone preview is already current."
            exit 0
          fi
          git commit -m "Build self-contained playable preview"
          git push origin HEAD:playable-preview-v2
